services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site_attendance_app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=site_attendance_db;Username=postgres;Password=postgres_rembang_2026;Include Error Detail=true
      - ADMIN_INITIAL_PASSWORD=AdminSite2026!
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: site_attendance_postgres
    environment:
      POSTGRES_DB: site_attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_rembang_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:

