name: Build, Test & Deploy CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore SiteAttendance/SiteAttendance.csproj

    - name: Build Project
      run: dotnet build SiteAttendance/SiteAttendance.csproj --no-restore --configuration Release

    - name: Run Automated Tests
      run: dotnet test SiteAttendance.Tests/SiteAttendance.Tests.csproj --no-build --verbosity normal

